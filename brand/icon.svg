<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD54F"/>
      <stop offset="1" stop-color="#FB8C00"/>
    </linearGradient>
    <linearGradient id="slat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5C6BC0"/>
      <stop offset="1" stop-color="#3949AB"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#81D4FA"/>
      <stop offset="1" stop-color="#E1F5FE"/>
    </linearGradient>
  </defs>
  <!-- sun behind the window -->
  <circle cx="184" cy="72" r="56" fill="url(#sun)"/>
  <!-- window frame -->
  <rect x="36" y="44" width="164" height="184" rx="18" fill="#263238"/>
  <rect x="50" y="78" width="136" height="136" rx="8" fill="url(#sky)"/>
  <!-- shutter box -->
  <rect x="28" y="36" width="180" height="40" rx="14" fill="#37474F"/>
  <!-- slats (shutter half closed) -->
  <g fill="url(#slat)">
    <rect x="50" y="78" width="136" height="16" rx="3"/>
    <rect x="50" y="98" width="136" height="16" rx="3"/>
    <rect x="50" y="118" width="136" height="16" rx="3"/>
    <rect x="50" y="138" width="136" height="16" rx="3"/>
  </g>
  <rect x="50" y="156" width="136" height="6" rx="3" fill="#1A237E"/>
  <!-- automation spark -->
  <circle cx="186" cy="198" r="40" fill="#FFFFFF"/>
  <circle cx="186" cy="198" r="34" fill="#FB8C00"/>
  <path d="M186 178 V198 L200 208" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
