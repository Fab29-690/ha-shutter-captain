command:
  fields:
    action:
      required: true
      example: close
      selector:
        select:
          options:
            - open
            - close
            - sun_protect
            - auto
            - manual
    area:
      required: false
      default: all
      example: living
      selector:
        select:
          options:
            - all
            - living
            - sleep
            - children
    device_type:
      required: false
      default: shutter
      example: garage
      selector:
        select:
          options:
            - shutter
            - awning
            - garage
            - roof_window

pause:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: cover
          multiple: true
    minutes:
      required: false
      example: 120
      selector:
        number:
          min: 1
          max: 10080
          unit_of_measurement: min

resume:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: cover
          multiple: true

vent:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: cover
          multiple: true

privacy:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: cover
          multiple: true
    override_lockout:
      required: false
      default: false
      selector:
        boolean:

my_position:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: cover
          multiple: true
    override_lockout:
      required: false
      default: false
      selector:
        boolean:
