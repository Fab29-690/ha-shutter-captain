name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest ruff
      - run: ruff check custom_components tests
      - run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Translations are generated from scripts/build-translations.mjs
        run: |
          node scripts/build-translations.mjs
          git diff --exit-code custom_components/shutter_pilot/translations
      - run: node --check custom_components/shutter_pilot/frontend/shutter-pilot-panel.js
